<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Order </title>
    <!-- Add a simple CSS for better readability -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0 20px;
            background-color: #f9f9f9;
        }
        header, footer {
            background-color: #ffee00;
            padding: 10px;
            text-align: center;
        }
        main {
            padding: 20px;
            background-color: #fff;
            margin: 20px auto;
            max-width: 800px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        fieldset {
            margin-bottom: 15px;
            padding: 15px;
        }
        legend {
            font-weight: bold;
        }
        label {
            display: block;
            margin: 5px 0 2px;
        }
        input[type="text"], input[type="email"], input[type="tel"], select, textarea {
            width: 100%;
            padding: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- Header section -->
    <header>
        <h1>Order Your Delicious Pizza!</h1>
        <p>Fill out the form below to place your order</p>
    </header>

    <!-- Main section with the pizza order -->
    <main>
            <!-- Customer information fieldset -->
            <fieldset>
                <legend>Customer Information</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </fieldset>

            <!-- Pizza options fieldset -->
            <fieldset>
                <legend>Pizza Options</legend>

                <label for="number">Number of Pizzas:</label>
                <input type="number" id="number" name="number" min="1" max="10" value="1">

                <label for="size">Size:</label>
                <select id="size" name="size">
                    <option value="small">Small (6 slices)</option>
                    <option value="medium">Medium (8 slices)</option>
                    <option value="large">Large (12 slices)</option>
                </select>

                <label><p> Shape:</label></p>
                <input type="radio" id="round" name="shape" value="round" checked>
                <label for="round">Round</label>
                <input type="radio" id="square" name="shape" value="square">
                <label for="square">Square</label>

                <label>Toppings:</label>
                <input type="checkbox" id="Sucuk" name="toppings[]" value="Sucuk">
                <label for="Sucuk">Sucuk</label>
                <input type="checkbox" id="mushroom" name="toppings[]" value="Mushrooms">
                <label for="mushroom">Mushrooms</label>
                <input type="checkbox" id="onion" name="toppings[]" value="Onions">
                <label for="onion">Onions</label>
                <input type="checkbox" id="extra-cheese" name="toppings[]" value="Extra Cheese">
                <label for="extra-cheese">Extra Cheese</label>

                <label for="crust">Crust Type:</label>
                <select id="crust" name="crust">
                    <option value="thin">Thin Crust</option>
                    <option value="deep">Deep Dish</option>
                    <option value="stuffed">Stuffed Crust</option>
                </select>

                <label><p>Type:</p> </label>
                <input type="radio" id="delivery" name="orderType" value="delivery" checked>
                <label for="delivery">Delivery</label>
                <input type="radio" id="takeout" name="orderType" value="takeout">
                <label for="takeout">Takeout</label>
                <input type="radio" id="eat-in" name="orderType" value="eat-in">
                <label for="eat-in">Eat-In</label>
            </fieldset>

            <!-- Special instructions -->
            <fieldset>
                <legend>Special Instructions</legend>
                <label for="instructions">Any special requests?</label>
                <textarea id="instructions" name="instructions" rows="4" placeholder="e.g., extra crispy, no olives, etc."></textarea>
            </fieldset>

            <!-- Fun additional inputs -->
            <fieldset>
                <legend>Extras</legend>

                <label for="delivery-date">Preferred Delivery Date:</label>
                <input type="date" id="delivery-date" name="delivery-date">

                <label for="spiciness">Spiciness Level:</label>
                <input type="range" id="spiciness" name="spiciness" min="0" max="10" >
            </fieldset>

            <!-- Submit/reset buttons -->
            <input type="submit" value="Place Order">
            <input type="reset" value="Reset Form">

            <!-- Example image -->
            <p>
                <img src="delicious pizza.png" alt="pizza illustration" width="300">
            </p>

        </form>
    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2025 Delicious Pizza </p>
    </footer>
</body>
</html>
